name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.13'
      - name: Select test Python
        shell: bash
        run: echo 'PYTHON=${{ steps.python.outputs.python-path }}' >> "$GITHUB_ENV"
      - name: Install pdftotext on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install pdftotext on macOS
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Install pdftotext on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Poppler installation failed' }
          $binary = Get-ChildItem "$env:ChocolateyInstall\lib\poppler" -Filter pdftotext.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'pdftotext.exe was not installed' }
          $binary.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc --all-features
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo package --locked --allow-dirty

  msrv:
    name: MSRV / 1.89.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.89.0 test --locked --all-targets --all-features
      - run: cargo +1.89.0 test --locked --doc --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
