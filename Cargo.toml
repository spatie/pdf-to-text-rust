[package]
name = "spatie-pdf-to-text"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Freek Van der Herten <freek@spatie.be>"]
description = "Extract text from a PDF"
license = "MIT"
repository = "https://github.com/spatie/pdf-to-text-rust"
documentation = "https://docs.rs/spatie-pdf-to-text"
readme = "README.md"
keywords = ["spatie", "pdf", "pdftotext", "poppler", "text"]
categories = ["text-processing"]
include = ["/src/", "/tests/", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.lock"]

[dependencies]
tempfile = "3.23"
thiserror = "2"
wait-timeout = "0.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
